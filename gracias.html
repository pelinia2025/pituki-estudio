<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>¡Gracias! — Pituki Estudio</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#0a0a0b"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0b'/%3E%3Cpath d='M16 6a7 7 0 0 0-4 12.7V21a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-2.3A7 7 0 0 0 16 6z' fill='none' stroke='%23c16b2f' stroke-width='2'/%3E%3Cpath d='M13.5 25.5h5' stroke='%23c16b2f' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700;800&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<style>
  .gracias{min-height:100dvh; display:flex; align-items:center; justify-content:center; text-align:center;}
  .gracias .wrap{max-width:680px;}
  .gracias-bulb{width:96px; margin:0 auto 34px; display:block;
    filter:drop-shadow(0 0 10px rgba(255,206,150,.5)) drop-shadow(0 0 34px rgba(224,126,54,.4));
    animation:graciasGlow 3.4s ease-in-out infinite;}
  @keyframes graciasGlow{0%,100%{opacity:.85; transform:scale(1);} 50%{opacity:1; transform:scale(1.04);}}
  .gracias h1{font-size:52px;}
  @media(min-width:640px){ .gracias h1{font-size:72px;} }
  .gracias h1 em{font-style:normal; color:var(--terracotta);}
  .gracias .kicker{margin-bottom:20px;}
  .gracias .sub{margin:22px auto 0;}
  .gracias-actions{display:flex; gap:18px; justify-content:center; flex-wrap:wrap; margin-top:40px;}
  .btn-ghost{border:1px solid var(--line-inverse); color:var(--white);}
  .btn-ghost:hover{border-color:var(--white);}
  @media (prefers-reduced-motion: reduce){ .gracias-bulb{animation:none;} }
</style>
</head>
<body>
<section class="band band-black gracias">
  <div class="wrap">
    <svg class="gracias-bulb" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M32 10a16 16 0 0 0-9 29.2V44a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4v-4.8A16 16 0 0 0 32 10Z" stroke="#F5F5F4" stroke-width="3"/>
      <path d="M27 53h10M29 58h6" stroke="#F5F5F4" stroke-width="3" stroke-linecap="round"/>
      <path d="M32 24a8 8 0 0 1 8 8" stroke="#c16b2f" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="kicker label" style="justify-content:center; color:var(--terracotta);">
      <span class="rule" style="background:var(--terracotta);"></span> MENSAJE ENVIADO <span class="rule" style="background:var(--terracotta);"></span>
    </div>
    <h1 class="h-hero">¡<em>Gracias</em>!</h1>
    <p class="sub center">Recibimos tu mensaje. Nuestro equipo te escribirá muy pronto para conversar sobre tu marca. Revisa tu correo: te enviamos una confirmación.</p>
    <div class="gracias-actions">
      <a href="/" class="btn btn-primary" style="background:var(--terracotta); padding:14px 30px; font-size:16px;">Volver al inicio</a>
      <a href="https://wa.me/50251315816" target="_blank" rel="noopener" class="btn btn-ghost" style="padding:14px 26px; font-size:16px;">Escríbenos por WhatsApp</a>
    </div>
  </div>
</section>
</body>
</html>
